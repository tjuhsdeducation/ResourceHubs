<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Resource Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Permanent+Marker&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: Classroom-style — home grid of class cards; each section = color banner + topic rail + topic lists */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1f2430; --muted:#5d6577; --line:#dfe3ea; --hover:#eef1f6;
  --accent:#2f5bd3; --chip:#e9eefb;
  --paper:#ffffff; --ink:#1b1b1b; --rule:#9aa0aa;
  --c-avid:#5b5fe0; --c-new:#14a37f; --c-study:#ee7d1c; --c-tech:#1f95e0; --c-college:#e0408a; --c-lessons:#8a54e0; --c-wicor:#f25c54; --k-handout:#3d6fb6; --k-lesson:#8a54e0; --k-graded:#e0503a; --k-link:#0f8a78;
  --ok:#2e7d32; --bad:#c62828;
  --tilebase:#ffffff; --mix:20%; --sticker:#ffffff; --hero:#fff7ec;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17151f; --surface:#211e2b; --fg:#ece9f5; --muted:#aaa5bd; --line:#352f45; --hover:#2a2637;
  --accent:#a9b4ff; --chip:#2c2a4a; --ok:#7bd88f; --bad:#ff8a80; --tilebase:#211e2b; --mix:30%; --sticker:#fdfbff; --hero:#241f30; --k-handout:#8fb4f0; --k-lesson:#c4a3ff; --k-graded:#ff9a85; --k-link:#5fd3bf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17151f; --surface:#211e2b; --fg:#ece9f5; --muted:#aaa5bd; --line:#352f45; --hover:#2a2637;
  --accent:#a9b4ff; --chip:#2c2a4a; --ok:#7bd88f; --bad:#ff8a80; --tilebase:#211e2b; --mix:30%; --sticker:#fdfbff; --hero:#241f30; --k-handout:#8fb4f0; --k-lesson:#c4a3ff; --k-graded:#ff9a85; --k-link:#5fd3bf; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--display);font-weight:700;font-size:1.2rem}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--c-avid);display:grid;place-items:center;color:#fff}
.crumb{color:var(--muted);font-size:.98rem;display:flex;gap:8px;align-items:center;min-width:0}
.crumb b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--hover);border-radius:24px;padding:6px 14px;min-width:0;max-width:300px;flex:1}
.search input{border:0;background:transparent;outline:none;width:100%;font:inherit;color:var(--fg)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
/* Home */
.hello{padding-block:28px 8px}
.hello h1{font-size:clamp(1.6rem,3.4vw,2.3rem)}
.hello p{color:var(--muted);margin:.35rem 0 0;max-width:62ch}
.hero{position:relative;margin-top:22px;border-radius:28px;background:var(--hero);padding:40px 28px 36px;text-align:center;overflow:hidden}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:700;line-height:1.05;position:relative}
.hero h1 span{color:var(--c-college)}
.hero p{position:relative;color:var(--muted);font-size:1.1rem;margin:.6rem auto 0;max-width:48ch;font-weight:600}
.hero svg.confetti{position:absolute;inset:0;width:100%;height:100%}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;padding-block:28px 56px}
.tiles .tile{flex:0 1 calc((100% - 66px)/4);min-width:0}
@media (max-width:1000px){.tiles .tile{flex-basis:calc((100% - 44px)/3)}}
@media (max-width:700px){.tiles .tile{flex-basis:calc((100% - 22px)/2)}}
@media (max-width:440px){.tiles .tile{flex-basis:100%}}
.tile{--r:-1.5deg;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 18px 22px;border-radius:28px;text-decoration:none;color:var(--fg);background:color-mix(in srgb,var(--c) var(--mix),var(--tilebase));border:3px solid color-mix(in srgb,var(--c) 45%,var(--tilebase));box-shadow:0 6px 0 color-mix(in srgb,var(--c) 55%,var(--tilebase));transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.tile:nth-child(even){--r:1.5deg}
.tile:hover{transform:translateY(-6px) rotate(var(--r))}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 55%,var(--tilebase))}
.tile .stk{width:132px;height:132px;border-radius:50%;background:var(--sticker);display:grid;place-items:center;box-shadow:0 4px 12px rgba(40,30,70,.12)}
.tile .stk svg{width:104px;height:104px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tile:hover .stk svg{transform:scale(1.08) rotate(-6deg)}
.tile h2{font-size:1.45rem;font-weight:600;text-align:center;color:var(--fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-block:20px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;transition:box-shadow .15s, transform .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-1px)}
.card .band{position:relative;height:104px;padding:16px 18px;color:#fff;background:var(--c)}
.card .band h2{font-size:1.4rem;line-height:1.15}
.card .band small{display:block;opacity:.9;margin-top:4px;font-size:.92rem}
.card .band svg.deco{position:absolute;right:10px;bottom:-14px;width:96px;height:96px;opacity:.22}
.card .body{padding:14px 18px 6px;flex:1;color:var(--muted);font-size:.95rem}
.card .body ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.card .body li{display:flex;gap:8px;align-items:center}
.card .body li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.card .foot{border-top:1px solid var(--line);padding:10px 18px;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between}
/* Section — space page: switcher chips, pastel banner, sticky topic rail, filter chips, topic panels of resource cards */
.switch{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:thin}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg);font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap}
.back:hover{background:var(--hover)}
.swchip{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;border-radius:999px;padding:7px 13px;white-space:nowrap;border:1px solid transparent}
.swchip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.swchip:hover{background:var(--hover);color:var(--fg)}
.swchip.on{background:color-mix(in srgb,var(--c) var(--mix),var(--tilebase));border-color:color-mix(in srgb,var(--c) 45%,var(--tilebase));color:var(--fg)}
.banner{margin-top:10px;border-radius:28px;color:var(--fg);background:color-mix(in srgb,var(--c) var(--mix),var(--tilebase));border:3px solid color-mix(in srgb,var(--c) 40%,var(--tilebase));padding:30px 190px 30px 30px;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.banner h1{font-size:clamp(1.9rem,4.4vw,2.8rem);font-weight:700}
.banner p{margin:0;color:var(--muted);max-width:58ch;font-weight:600}
.banner .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.banner .stats span{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700;color:var(--fg)}
.banner .art{position:absolute;right:28px;top:50%;transform:translateY(-50%) rotate(4deg);width:136px;height:136px;border-radius:50%;background:var(--sticker);display:grid;place-items:center;box-shadow:0 6px 16px rgba(40,30,70,.14)}
.banner .art svg{width:106px;height:106px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:22px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 10px}
.rail .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 10px 6px;font-weight:800}
.rail a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-size:.95rem;font-weight:600}
.rail a small{color:var(--muted);font-weight:700}
.rail a:hover{background:var(--hover)}
.rail a.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--fg)}
.rail a.on small{color:var(--c)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--muted)}
.fchip:hover{color:var(--fg)}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.topic{margin-bottom:22px;scroll-margin-top:84px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 20px 22px}
.topic>header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.topic>header .dot{width:14px;height:14px;border-radius:5px;background:var(--c);transform:rotate(12deg);flex:none}
.topic>header h2{font-size:1.45rem;font-weight:600}
.topic>header small{margin-left:auto;color:var(--muted);font-weight:700;white-space:nowrap}
.topic>p.sub{color:var(--muted);margin:2px 0 0 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.rcard{display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.rcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(40,30,70,.10);border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.rcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.rcard .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);flex:none}
.rcard .ico svg{width:21px;height:21px}
.kpill{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:var(--k);background:color-mix(in srgb,var(--k) 14%,var(--surface))}
.k-handout{--k:var(--k-handout)}.k-lesson{--k:var(--k-lesson)}.k-graded{--k:var(--k-graded)}.k-link{--k:var(--k-link)}.k-nav{--k:var(--c)}.k-note{--k:var(--muted)}

/* WICOR letter/subject buttons */
.wh{font-size:1.5rem;margin:30px 0 0;text-align:center}
.tiles.wt{padding-block:18px 10px;gap:18px}
.tiles.wt .tile{flex:0 1 calc((100% - 72px)/5)}
@media (max-width:1000px){.tiles.wt .tile{flex-basis:calc((100% - 36px)/3)}}
@media (max-width:640px){.tiles.wt .tile{flex-basis:calc((100% - 18px)/2)}}
.tiles.wt .tile .stk{width:104px;height:104px}
.tiles.wt .tile small{color:var(--muted);font-weight:700;margin-top:-8px}
.biglet{font:700 64px/1 var(--display);color:var(--c)}
.bigemoji{font-size:54px;line-height:1}
.banner .art .biglet{font-size:76px}.banner .art .bigemoji{font-size:64px}
.wsub{padding-block:16px 48px;display:grid;gap:18px}
/* student sign-in */
.gate{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
@media (max-width:760px){.gate{grid-template-columns:1fr}}
.g-kick{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--c)}
.gate h2{font-size:1.6rem;margin:4px 0 14px}
.g-lbl{display:block;font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.g-eq,.g-lt{background:color-mix(in srgb,var(--c) 10%,var(--surface));border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.g-eq p{margin:0;font-family:var(--display);font-size:1.15rem;font-weight:600}
.g-lt ul{margin:0;padding-left:20px;font-weight:600}
.g-form{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
.g-form h3{margin:0;font-size:1.2rem}
.g-form label{display:grid;gap:4px;font-weight:800;font-size:.92rem}
.g-form input,.g-form select{font:600 1rem var(--body);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.g-form input:focus,.g-form select:focus{outline:none;border-color:var(--c)}
.g-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g-start{font:800 1.1rem var(--body);padding:12px;border-radius:999px;border:0;background:var(--c);color:#fff;cursor:pointer;transition:transform .15s}
.g-start:hover:not(:disabled){transform:translateY(-2px)}
.g-start:disabled{opacity:.45;cursor:not-allowed}
.g-msg{margin:0;color:var(--muted);font-weight:700;font-size:.9rem;text-align:center}
.tstrip{display:grid;gap:4px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.tstrip .who{font-weight:800;color:var(--muted)}
.k-print{--k:var(--c)}.k-page{--k:#8a54e0}
.rcard.printable{cursor:default}
.rcard .pmeta{display:flex;gap:6px;flex-wrap:wrap}
.rcard .aud{font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--fg)}
.rcard .aud.a-student{background:#fff1cf;color:#7a4f00}.rcard .aud.a-teacher{background:#ece6ff;color:#4b32b8}.rcard .aud.a-new{background:#ffe1dc;color:#b42318}
.rcard .pbtns{display:flex;gap:8px;flex-wrap:wrap}
.rcard .pbtns a{text-decoration:none;font-weight:800;font-size:.85rem;padding:6px 12px;border-radius:999px;border:2px solid var(--c);color:var(--c);transition:background .15s,color .15s}
.rcard .pbtns a:hover,.rcard .pbtns a.pr{background:var(--c);color:#fff}
.rcard .pbtns a.pr:hover{filter:brightness(1.1)}
.rcard .t{font-weight:800;font-size:1.04rem;line-height:1.3}
.rcard .d{color:var(--muted);font-size:.92rem}
.rcard .from{font-size:.82rem;font-weight:700;color:var(--c)}
.rcard .go{margin-top:auto;padding-top:8px;font-weight:800;font-size:.88rem;color:var(--c)}
.rcard.add{border-style:dashed;border-width:2px;background:transparent;cursor:default}
.rcard.add:hover{transform:none;box-shadow:none}
.rcard.add .ico{background:transparent;border:2px dashed var(--c)}
.rcard.feature{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;background:color-mix(in srgb,var(--c) 10%,var(--bg))}
.rcard.feature .top{margin:0}
.rcard.feature .go{margin:0 0 0 auto;padding:0;white-space:nowrap}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:520px){header.top .wrap{flex-wrap:wrap}.search{flex-basis:100%;max-width:none}.spacer{display:none}}
@media (max-width:820px){.layout{grid-template-columns:1fr}.rail{display:none}.search{max-width:none}.crumb{display:none}.banner{padding-right:30px}.banner .art{display:none}.rcard.feature{flex-direction:column;align-items:flex-start}.rcard.feature .go{margin:0}}
/* Modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px, env(safe-area-inset-right,0px)) 24px max(12px, env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:12px;width:min(900px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.dialog.wide{width:min(1100px,100%)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--c);color:#fff}
.dhead h3{font-size:1.15rem;flex:1;min-width:0}
.dhead button{background:rgba(255,255,255,.18);border:0;border-radius:8px;color:#fff;padding:6px 12px;cursor:pointer;font-weight:600}
.dhead button:hover{background:rgba(255,255,255,.3)}
.dbody{padding:20px}
.note{background:var(--chip);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:.92rem;margin-bottom:16px}
/* Paper handouts (stay paper-white in both themes) */
.paper{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:32px 36px;font-family:var(--body);box-shadow:0 2px 8px rgba(0,0,0,.08);overflow-x:auto}
.paper h2{font-family:var(--display);font-size:1.6rem;margin-bottom:4px;color:var(--ink)}
.paper h4{margin:18px 0 6px;font-size:1rem;text-transform:uppercase;letter-spacing:.06em}
.paper .row{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.paper .fill{flex:1;min-width:140px;border-bottom:1px solid var(--ink);padding-top:14px;font-size:.85rem}
.paper table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem;min-width:520px}
.paper th,.paper td{border:1px solid var(--ink);padding:8px 10px;text-align:left;vertical-align:top}
.paper th{background:#eceff3}
.paper .lines{height:var(--h,120px);background:repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px)}
.paper .twocol{display:grid;grid-template-columns:30% 70%;border:1px solid var(--ink);min-width:520px}
.paper .twocol>div{padding:8px 10px}
.paper .twocol>div:first-child{border-right:1px solid var(--ink)}
.paper .box{border:1px solid var(--ink);padding:8px 10px;margin-top:10px}
.paper ol,.paper ul{padding-left:1.3em;margin:.3em 0}
.paper .phase{display:grid;grid-template-columns:44px 1fr;gap:12px;margin:12px 0}
.paper .phase .n{width:40px;height:40px;border-radius:50%;background:#3f51b5;color:#fff;display:grid;place-items:center;font-weight:700}
.paper .cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.paper .cols3>div{border:1px solid var(--ink);padding:10px 12px;border-radius:4px}
.paper small{color:#555}
/* Lesson UI */
.lesson{font-size:1.05rem}
.lesson .q{font-family:var(--display);font-size:1.45rem;margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;text-align:left;cursor:pointer;font-size:1.02rem}
.opt:hover{border-color:var(--c)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.bar{height:8px;background:var(--hover);border-radius:4px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.btn{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.feedback{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--hover)}
textarea,input.txt{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.cn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:12px}

 costa:{title:'Costa’s Levels of Thinking & Questioning', html:`<h2>Costa’s Levels of Thinking</h2><small>Use these stems to write questions in the left column of your notes and on your TRF.</small>
  <div class="cols3" style="margin-top:14px">
   <div><b>Level 1 · Gathering</b><br><small>Recall facts. The answer is right there.</small><ul><li>What is…?</li><li>Define / list / name…</li><li>When did…?</li><li>Who was…?</li><li>Identify…</li></ul></div>
   <div><b>Level 2 · Processing</b><br><small>Make sense of information.</small><ul><li>Compare and contrast…</li><li>What is the cause of…?</li><li>Explain why…</li><li>How is ___ related to ___?</li><li>Summarize / classify…</li></ul></div>
   <div><b>Level 3 · Applying</b><br><small>Go beyond the text.</small><ul><li>What would happen if…?</li><li>Predict / evaluate…</li><li>How would you design…?</li><li>What is the best solution and why?</li><li>Imagine / hypothesize…</li></ul></div>
  </div>`},
 wicor:{title:'WICOR at a Glance', html:`<h2>WICOR at a Glance</h2><small>AVID’s framework for teaching and learning in every content area.</small>

  <tr><td><b>C</b>ollaboration</td><td>Structured academic talk and group work</td><td>Think-pair-share, philosophical chairs, gallery walks</td></tr>
  <tr><td><b>O</b>rganization</td><td>Managing materials, time, and learning</td><td>Binders, planners, goal setting, grade checks</td></tr>
  <tr><td><b>R</b>eading</td><td>Reading to learn with purpose</td><td>Marking the text, critical reading, pre-reading vocabulary</td></tr></table>`},
 firstweek:{title:'First-Week Checklist', html:`<h2>First-Week Checklist</h2>
  <h4>Before students arrive</h4><ul>${['Get keys, ID badge, and copier code','Log in to the gradebook, email, and Google Classroom','Print rosters and make seating charts','Check for students with IEPs, 504 plans, and EL designations','Set up room: supply station, turn-in tray, posted agenda space','Write sub plans and an emergency folder','Find your evacuation route and lockdown procedures'].map(x=>`<li>☐ ${x}</li>`).join('')}</ul>

 contactlog:{title:'Parent/Guardian Contact Log', html:`<h2>Parent/Guardian Contact Log</h2><div class="row"><div class="fill">Teacher</div><div class="fill">School year</div></div>

 positivecall:{title:'Positive Phone Call Script', html:`<h2>Positive Phone Call Script</h2><small>Aim for two good-news calls a week. Keep it under two minutes.</small>
  <ol style="margin-top:12px;display:grid;gap:10px">

 cycle:{title:'The Lesson Study Cycle', html:`<h2>The Lesson Study Cycle</h2><small>A team plans one research lesson, one member teaches it, everyone observes students, and the team learns together.</small>
  ${[['Study','Choose a goal for student learning. Study standards, curriculum, and student work to understand where students struggle.'],['Plan','Design the research lesson together. Anticipate student thinking and decide what evidence observers will collect.'],['Teach & Observe','One teacher teaches. Observers watch students — not the teacher — and record what students say, write, and do.'],['Reflect','Debrief with evidence. What did students learn? What would we revise? Share learnings with colleagues.']]
  .map((p,i)=>`<div class="phase"><div class="n" style="background:#b35c00">${i+1}</div><div><b>${p[0]}</b><br>${p[1]}</div></div>`).join('')}
  <h4>Team roles</h4><ul><li><b>Facilitator</b> keeps time and norms</li><li><b>Host teacher</b> teaches the research lesson</li><li><b>Observers</b> each focus on 2–4 students</li><li><b>Note-taker</b> captures the debrief</li></ul>`},
 studyplan:{title:'Research Lesson Planning Template', html:`<h2>Research Lesson Plan</h2><div class="row"><div class="fill">Team</div><div class="fill">Course / grade</div><div class="fill">Date taught</div></div>
  ${['Research goal (long-term student learning goal)','Lesson goal & standard','Why this topic? (what we noticed in student work)'].map(x=>`<h4>${x}</h4><div class="lines" style="--h:56px"></div>`).join('')}
  <table><tr><th style="width:18%">Time</th><th>Learning activity & key questions</th><th>Anticipated student responses</th><th>Teacher support</th><th>What observers look for</th></tr>${Array(5).fill('<tr><td style="height:64px"></td><td></td><td></td><td></td><td></td></tr>').join('')}</table>`},
 observe:{title:'Observation Notes Form', html:`<h2>Observation Notes</h2><div class="row"><div class="fill">Observer</div><div class="fill">Students I’m observing</div></div>
  <small>Record what students say, write, and do. Quote students when you can. Avoid judging the teacher.</small>
  <table><tr><th style="width:14%">Time</th><th>What students said / did / wrote</th><th style="width:30%">What it suggests about their thinking</th></tr>${Array(8).fill('<tr><td style="height:52px"></td><td></td><td></td></tr>').join('')}</table>`},
 debrief:{title:'Post-Lesson Debrief Protocol', html:`<h2>Post-Lesson Debrief Protocol</h2><small>About 45 minutes. The facilitator keeps time.</small>
  <table><tr><th style="width:18%">Time</th><th>Step</th></tr>
  <tr><td>5 min</td><td><b>Host teacher reflects first:</b> What went as planned? What surprised you?</td></tr>
  <tr><td>15 min</td><td><b>Observers share evidence</b> tied to the research goal — one round each, no cross-talk.</td></tr>
  <tr><td>10 min</td><td><b>Discussion:</b> What did students learn? Where did thinking break down?</td></tr>
  <tr><td>10 min</td><td><b>Revisions:</b> What would we change in the lesson, and why?</td></tr>
  <tr><td>5 min</td><td><b>Takeaways:</b> One thing each of us will try in our own classroom.</td></tr></table>
  <h4>Norms</h4><ul><li>The lesson belongs to the whole team.</li><li>Talk about student evidence, not the teacher.</li><li>Stay curious and specific.</li></ul>`},

const L = {
 quiz:{title:'College Knowledge Quiz', run(el){
  const Q=[
   ['How many years of English are required for UC and CSU (the “B” requirement)?',['2','3','4','5'],2,'Four years of college-prep English.'],
   ['What is the minimum grade an A–G course must earn to count for UC/CSU?',['D','C','B','A'],1,'A grade of C or better.'],
   ['What does FAFSA stand for?',['Free Application for Federal Student Aid','Federal Assistance for Students Applying','Financial Aid for State Admissions','Free Award for Student Achievement'],0,'It’s free — never pay to submit a FAFSA.'],
   ['Undocumented students in California can apply for state financial aid using the…',['FAFSA','CADAA (California Dream Act Application)','SAT','Common App'],1,'The CADAA is filed through the California Student Aid Commission.'],
   ['What’s the difference between a grant and a loan?',['Grants must be repaid; loans don’t','Loans must be repaid; grants usually don’t','They are the same','Grants are only for athletes'],1,'Grants are free money; loans are borrowed and repaid with interest.'],
   ['Which California system offers associate degrees and a path to transfer to a university?',['University of California','California State University','California Community Colleges','Private colleges only'],2,'Community colleges offer associate degrees, certificates, and transfer pathways.'],
   ['An Associate Degree for Transfer (ADT) from a community college guarantees…',['Admission to Harvard','Admission to the CSU system (not always a specific campus)','A full scholarship','No more classes'],1,'ADT students get priority admission to the CSU system.'],
   ['The “F” requirement is one year of…',['Physical education','Visual & performing arts','Foreign language','Finance'],1,'Art, music, theater, dance, or media arts.'],
   ['How many UC campuses offer undergraduate degrees?',['5','9','12','23'],1,'Berkeley, Davis, Irvine, LA, Merced, Riverside, San Diego, Santa Barbara, and Santa Cruz.'],
   ['When do seniors usually submit UC and CSU applications?',['Spring of senior year','Fall of senior year','Summer after graduation','Junior year'],1,'Applications open in the fall of senior year — check each system’s site for exact dates.']
  ];
  let i=0,score=0;
  const draw=()=>{
   if(i>=Q.length){el.innerHTML=`<div class="lesson"><div class="q">You scored ${score} out of ${Q.length}</div><p>${score>=8?'College-ready knowledge!':score>=5?'Solid start — review the ones you missed.':'Great time to talk with your counselor or visit CaliforniaColleges.edu.'}</p><div class="btnrow"><button class="btn" id="again">Play again</button></div></div>`;el.querySelector('#again').onclick=()=>{i=0;score=0;draw()};return}
   const [q,opts,ans,why]=Q[i];
   el.innerHTML=`<div class="lesson"><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><small style="color:var(--muted)">Question ${i+1} of ${Q.length} · Score ${score}</small><div class="q">${q}</div><div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div id="fb"></div></div>`;
   el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j; el.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    el.querySelectorAll('.opt')[ans].classList.add('right'); if(j===ans)score++; else b.classList.add('wrong');
    el.querySelector('#fb').innerHTML=`<div class="feedback"><b>${j===ans?'Correct!':'Not quite.'}</b> ${why}</div><div class="btnrow"><button class="btn" id="nx">${i===Q.length-1?'See score':'Next question'}</button></div>`;
    el.querySelector('#nx').onclick=()=>{i++;draw()};
   });
  };draw();
 }},
 career:{title:'Career Interest Sort', run(el){
  const S=[['Fixing or building things with tools','R'],['Working outdoors or with animals','R'],['Doing experiments or solving puzzles','I'],['Figuring out how things work','I'],['Drawing, writing stories, or making music','A'],['Designing videos, outfits, or spaces','A'],['Helping friends with problems','S'],['Teaching or coaching others','S'],['Leading a team or project','E'],['Selling an idea or persuading people','E'],['Keeping records and things organized','C'],['Working with numbers and spreadsheets','C']];
  const INFO={R:['Realistic — Doers','Electrician, mechanic, agricultural technician, firefighter, engineer technician'],I:['Investigative — Thinkers','Nurse practitioner, lab scientist, software developer, veterinarian, pharmacist'],A:['Artistic — Creators','Graphic designer, architect, journalist, video editor, music producer'],S:['Social — Helpers','Teacher, counselor, physical therapist, social worker, dental hygienist'],E:['Enterprising — Persuaders','Business owner, marketing manager, lawyer, real estate agent, police officer'],C:['Conventional — Organizers','Accountant, paralegal, payroll specialist, data analyst, medical records technician']};
  el.innerHTML=`<div class="lesson"><div class="q">Check everything you enjoy.</div><div class="likes">${S.map((s,i)=>`<label><input type="checkbox" id="cs${i}" data-c="${s[1]}"> ${s[0]}</label>`).join('')}</div><div class="btnrow"><button class="btn" id="go">See my results</button></div><div id="res"></div></div>`;
  el.querySelector('#go').onclick=()=>{
   const t={R:0,I:0,A:0,S:0,E:0,C:0}; el.querySelectorAll('input:checked').forEach(c=>t[c.dataset.c]++);
   const top=Object.entries(t).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,2);
   el.querySelector('#res').innerHTML= top.length? `<h3 style="margin-top:20px">Your top interest areas</h3>${top.map(([k])=>`<div class="result"><b>${INFO[k][0]}</b><br>Careers to explore: ${INFO[k][1]}</div>`).join('')}<p>Want a deeper look? Try the free <a href="https://www.mynextmove.org/explore/ip" target="_blank" rel="noopener">O*NET Interest Profiler</a>.</p>` : '<div class="feedback">Check at least one activity to see results.</div>';
  };
 }},
 cornell:{title:'Focused Notes Practice', run(el){
  el.innerHTML=`<div class="lesson"><div class="cn" style="margin-bottom:12px"><div><span class="lab">Topic</span><input class="txt" id="cnt" placeholder="e.g. Causes of the Dust Bowl"></div><div><span class="lab">Essential question</span><input class="txt" id="cneq" placeholder="What question should these notes answer?"></div></div>
  <div class="cn"><div><label for="cnq">Questions / key ideas</label><textarea id="cnq" rows="12" placeholder="Write Costa’s Level 1–3 questions here as you process"></textarea></div><div><label for="cnn">Notes</label><textarea id="cnn" rows="12" placeholder="Key ideas in your own words — use abbreviations and symbols"></textarea></div></div>
  <div style="margin-top:12px"><label for="cns" class="lab">Summary</label><textarea id="cns" rows="4" placeholder="Answer the essential question using your notes"></textarea></div>
  <span class="lab" style="margin-top:14px">Phase checklist</span><div class="checks">${['1 · Took notes','2 · Processed (highlight, circle, question)','3 · Connected thinking','4 · Summarized & reflected','5 · Applied (self-quizzed)'].map((p,i)=>`<label><input type="checkbox" id="ph${i}"> ${p}</label>`).join('')}</div>
  <div class="btnrow"><button class="btn" id="cp">Copy my notes</button><span id="cpmsg" style="color:var(--muted)"></span></div></div>`;
  el.querySelector('#cp').onclick=async()=>{
   const v=id=>el.querySelector(id).value;
   const txt=`TOPIC: ${v('#cnt')}\nESSENTIAL QUESTION: ${v('#cneq')}\n\nQUESTIONS:\n${v('#cnq')}\n\nNOTES:\n${v('#cnn')}\n\nSUMMARY:\n${v('#cns')}`;
   const m=el.querySelector('#cpmsg');
   try{await navigator.clipboard.writeText(txt);m.textContent='Copied — paste into a Google Doc or Classroom assignment.'}catch(e){m.textContent='Copy is blocked here — select the text and copy it manually.'}
  };

 costasort:{title:'Sort the Question', run(el){

/* ---------- POINT OF CONFUSION ---------- */
const POC_STUCK={
 Math:['I don’t know which formula or method to use','I get stuck on one specific step','My answer doesn’t match the answer key','I can’t turn the word problem into an equation','I don’t understand a vocabulary word or symbol'],
 Science:['I don’t understand how two ideas are connected','My lab results didn’t match what I expected','I can’t read the graph or data table','I don’t know which formula or unit to use','I don’t understand a vocabulary word'],
 English:['I can’t find evidence for my claim','I can’t explain how my evidence supports my claim','I don’t understand a word, line, or passage','I can’t figure out the theme or author’s purpose','I don’t know how to start or organize my writing'],
 History:['I don’t understand why an event caused another event','I can’t tell the difference between two ideas or groups','I don’t understand a primary source','I can’t connect the past to the question being asked','I don’t understand a vocabulary word'],
 'World Language':['I don’t know how to conjugate a verb in this tense','I don’t understand why the word order is different','I don’t know which word to use (two words seem the same)','I can’t understand a sentence when I read or hear it'],
 Other:['I get stuck on one specific step','I don’t understand how two ideas are connected','I don’t understand a vocabulary word','I don’t know how to start']
};
const POC_VAGUE=/\b(i don'?t get it|i don’t get it|everything|all of it|the whole thing|idk|no idea|nothing makes sense|i'?m just confused|i’m just confused|help me)\b/i;
const POC_SPECIFIC=/(\d|step|line|part|paragraph|question|problem|#|when i|after i|where|the word|the graph|the table|equation|formula|quote|source|sentence|verb|coefficient|variable|side)/i;
H.pocframes={title:'Writing a Strong Point of Confusion', html:`<h2>Writing a Strong Point of Confusion</h2><small>Your point of confusion (POC) tells your tutorial group exactly where your thinking stops, so they can ask the right questions.</small>
 <div class="box" style="font-size:1.15rem;text-align:center;margin-top:14px"><b>I understand</b> ________, <b>but I get stuck when</b> ________ <b>because</b> ________.</div>
 <h4>A strong POC…</h4><ul><li>☐ Comes from a <b>real question</b> copied exactly, with its source (HW p. 112 #14, Quiz 3 #5, Lab 2 question c)</li><li>☐ Says what you <b>already understand</b></li><li>☐ Names the <b>exact step, line, or part</b> where you get stuck</li><li>☐ Explains <b>why</b> that part is confusing</li></ul>
 <h4>Avoid</h4><p>“I don’t get it.” · “Everything.” · “The whole worksheet.” · “I’m confused about chapter 5.”</p>
 <h4>Frames by subject</h4>
 <table><tr><th>Subject</th><th>Try one of these</th></tr>
 <tr><td>Math</td><td>I can ___, but when I get to step ___, I don’t know how to ___.<br>I got ___ but the answer key says ___. I think my mistake is in ___.</td></tr>
 <tr><td>Science</td><td>I understand ___, but I can’t tell how ___ affects ___.<br>In the lab I expected ___ but got ___, and I don’t know why.</td></tr>
 <tr><td>English</td><td>I found evidence in paragraph ___, but I can’t explain how it shows ___.<br>I don’t understand what the author means by “___” in line ___.</td></tr>
 <tr><td>History</td><td>I know ___ happened, but I don’t understand why it led to ___.<br>I can’t tell the difference between ___ and ___.</td></tr>
 <tr><td>World Language</td><td>I know the verb ___, but I’m not sure how to conjugate it in the ___ tense for ___.</td></tr></table>
 <h4>Before → After</h4>
 <table><tr><th>Vague</th><th>Strong</th></tr>
 <tr><td>I don’t get #5.</td><td>On HW p. 88 #5, I distributed the 3 to get 3x − 12 = 2x + 5, but I get stuck when there’s x on both sides because I don’t know which side to move it to.</td></tr>
 <tr><td>I’m confused about the essay.</td><td>I found a quote in paragraph 3 for my claim, but I can’t explain how it proves the narrator is unreliable.</td></tr></table>`};
L.pocbuilder={title:'Point of Confusion Builder', run(el){
  const v={source:'Homework',subject:'Math',where:'',question:'',tried:'',stuck:'',know:'',when:'',because:'',ask:''};
  const ex={source:'Homework',subject:'Math',where:'Algebra HW p. 88 #5',question:'Solve 3(x − 4) = 2x + 5',tried:'1. I distributed the 3 and got 3x − 12 = 2x + 5.\n2. I tried adding 12 to both sides and got 3x = 2x + 17.',stuck:POC_STUCK.Math[1],know:'how to distribute the 3 and add 12 to both sides',when:'I have x on both sides of the equation (3x = 2x + 17)',because:'I don’t know which side to move the x to or if it matters',ask:'How do I get the x terms on the same side?'};
  const step=(n,t,body)=>`<section class="pstep"><div class="pnum">${n}</div><div class="pbody"><h3>${t}</h3>${body}</div></section>`;
  const checks=()=>{
    const poc=`${v.know} ${v.when} ${v.because}`;
    return [
      ['Real question copied, with where it came from', v.question.trim().split(/\s+/).length>=3 && v.where.trim().length>2],
      ['Shows the steps you tried', words(v.tried)>=6],
      ['Says what you already understand', words(v.know)>=3],
      ['Names the exact step or part where you’re stuck', words(v.when)>=4 && POC_SPECIFIC.test(v.when)],
      ['Explains why it’s confusing', words(v.because)>=4],
      ['No vague phrases like “I don’t get it”', poc.trim().length>0 && !POC_VAGUE.test(poc)]
    ];
  };
  const draw=()=>{
    el.innerHTML=`<div class="lesson poc">
     <div class="btnrow" style="margin:0 0 14px;justify-content:space-between"><span style="color:var(--muted);font-weight:600">Build your POC one step at a time. It updates as you type.</span><span><button class="btn ghost" id="pex">See an example</button> <button class="btn ghost" id="pclr">Start over</button></span></div>
     ${step(1,'Where is your question from?',`<div class="checks">${['Homework','Quiz / Test','Classwork','Notes','Lab','Reading'].map(x=>`<button class="lvbtn ${v.source===x?'on':''}" data-src="${x}">${x}</button>`).join('')}</div><div class="checks">${Object.keys(POC_STUCK).map(x=>`<button class="lvbtn ${v.subject===x?'on':''}" data-sub="${x}">${x}</button>`).join('')}</div><span class="lab">Exactly where? (page, number, assignment)</span><input class="txt" id="pw" placeholder="e.g. Biology Quiz 3, #5" value="${esc(v.where)}">`)}
     ${step(2,'Copy the question word-for-word',`<textarea id="pq" rows="2" placeholder="Copy the exact problem or prompt, not a summary of it">${esc(v.question)}</textarea>`)}
     ${step(3,'What did you try?',`<textarea id="pt" rows="3" placeholder="1. First I…  2. Then I…">${esc(v.tried)}</textarea><div class="hint">Even wrong steps help! They show your group where your thinking went.</div>`)}
     ${step(4,'What kind of stuck are you?',`<div class="stucks">${POC_STUCK[v.subject].map(x=>`<button class="stk-opt ${v.stuck===x?'on':''}" data-stuck="${esc(x)}">${x}</button>`).join('')}</div>`)}
     ${step(5,'Build your point of confusion',`<div class="frame"><label for="pk">I understand…</label><input class="txt" id="pk" placeholder="what you CAN do or already know" value="${esc(v.know)}"><label for="pwn">but I get stuck when…</label><input class="txt" id="pwn" placeholder="the exact step, line, or part" value="${esc(v.when)}"><label for="pb">because…</label><input class="txt" id="pb" placeholder="why that part is confusing" value="${esc(v.because)}"><label for="pa">A question I can ask my group (optional)</label><input class="txt" id="pa" placeholder="How do I…? Why does…?" value="${esc(v.ask)}"></div>`)}
     <div class="pocout"><div class="meter" id="pmeter"></div><ul class="pchecks" id="pchecks"></ul>
      <div class="trfcard" id="pcard"></div>
      <div class="btnrow"><button class="btn" id="pcopy">Copy for my TRF</button><span id="pmsg" style="color:var(--muted)"></span></div></div></div>`;
    el.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{v.source=b.dataset.src;draw()});
    el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{v.subject=b.dataset.sub;v.stuck='';draw()});
    el.querySelectorAll('[data-stuck]').forEach(b=>b.onclick=()=>{v.stuck=b.dataset.stuck;draw()});
    const bind={pw:'where',pq:'question',pt:'tried',pk:'know',pwn:'when',pb:'because',pa:'ask'};
    Object.entries(bind).forEach(([id,k])=>{el.querySelector('#'+id).oninput=e=>{v[k]=e.target.value;out()}});
    el.querySelector('#pex').onclick=()=>{Object.assign(v,ex);draw()};
    el.querySelector('#pclr').onclick=()=>{Object.keys(v).forEach(k=>v[k]='');v.source='Homework';v.subject='Math';draw()};
    el.querySelector('#pcopy').onclick=async()=>{const m=el.querySelector('#pmsg');try{await navigator.clipboard.writeText(text());m.textContent='Copied! Paste it into your TRF.'}catch(e){m.textContent='Copy is blocked here. Write it on your TRF from the card above.'}};
    out();
  };
  const sentence=()=>v.know||v.when||v.because?`I understand ${v.know||'___'}, but I get stuck when ${v.when||'___'} because ${v.because||'___'}.`:'';
  const text=()=>`SOURCE: ${v.source}${v.where?' – '+v.where:''} (${v.subject})\nINITIAL QUESTION: ${v.question}\nWHAT I TRIED:\n${v.tried}\nPOINT OF CONFUSION: ${sentence()}${v.ask?'\nQUESTION FOR MY GROUP: '+v.ask:''}`;
  function out(){
    const c=checks(),n=c.filter(x=>x[1]).length;
    const lvl=n<=2?['Vague','25%','var(--bad)']:n<=4?['Getting there','60%','#e0a100']:n===5?['Almost tutorial-ready','85%','var(--k-link)']:['Tutorial-ready!','100%','var(--ok)'];
    el.querySelector('#pmeter').innerHTML=`<div class="mlabel"><b>${lvl[0]}</b><span>${n} of 6</span></div><div class="bar"><i style="width:${lvl[1]};background:${lvl[2]}"></i></div>`;
    el.querySelector('#pchecks').innerHTML=c.map(([t,ok])=>`<li class="${ok?'ok':''}">${ok?'✓':'○'} ${t}</li>`).join('');
    el.querySelector('#pcard').innerHTML=`<div class="tlabel">My TRF</div><div><b>Source:</b> ${esc(v.source)}${v.where?' – '+esc(v.where):''} · ${esc(v.subject)}</div><div><b>Initial question:</b> ${esc(v.question)||'<span class="ph">copy your question in step 2</span>'}</div>${v.stuck?`<div><b>Type of stuck:</b> ${esc(v.stuck)}</div>`:''}<div class="pocs">${esc(sentence())||'<span class="ph">Your point of confusion will appear here</span>'}</div>${v.ask?`<div><b>Question for my group:</b> ${esc(v.ask)}</div>`:''}`;
  }
  draw();
}};

/* ---------- HANDS-ON MARKING ENGINE ---------- */
const normW=w=>w.toLowerCase().replace(/[^a-z0-9áéíóúñü'-]/g,'').replace(/'s$/,'');
function mkTok(it){
  if(it._tok)return it._tok;
  it._tok=it.paras.map(p=>({sents:(it.split==='line'?[p]:p.split(/(?<=[.!?][”"’)]?)\s+(?=[A-Z“"(])/)).map(s=>({words:s.split(/\s+/).filter(Boolean).map(t=>({t,n:normW(t)}))}))}));
  return it._tok;
}
const mkNew=it=>({words:new Set(),sents:{},nums:{},tool:it.tools[0].id});
function markHTML(it,s,k,show){
  const tok=mkTok(it), tool=it.tools.find(t=>t.id===s.tool), hasNum=it.tools.some(t=>t.unit==='para');
  const wordTool=it.tools.find(t=>t.unit==='word');
  const sstyle=t=>t.style==='ul'?`text-decoration:underline;text-decoration-color:${t.color};text-decoration-thickness:3px;text-underline-offset:5px`:`background:color-mix(in srgb,${t.color} 32%,transparent);border-radius:4px`;
  const ansS=new Set(),ansFor={};it.tools.filter(t=>t.unit==='sentence').forEach(t=>t.answer.forEach(a=>{ansS.add(a);ansFor[a]=t}));
  return `<div class="citem"><div class="mk-mission"><b>Your mission:</b> ${it.mission}</div>
   <div class="mk-tools">${it.tools.map(t=>`<button class="mk-t ${t.id===s.tool?'on':''}" style="--t:${t.color}" data-k="${k}" data-mkt="${t.id}" ${show?'disabled':''}><i class="sw ${t.unit==='word'?'circ':t.unit==='para'?'num':t.style==='ul'?'ul':'hl'}"></i>${t.label}</button>`).join('')}</div>
   ${tool&&!show?`<div class="mk-hint">${tool.unit==='word'?'Tap a word to circle it. Tap again to remove.':tool.unit==='para'?'Tap each paragraph in order to number it. Tap again to remove.':'Tap a sentence to mark it. Tap again to remove.'}</div>`:''}

function scoreMark(it,s){
  const tok=mkTok(it); let score=0; const notes=[];
  it.tools.forEach(t=>{
    if(t.unit==='para'){const ok=tok.every((_,pi)=>s.nums[pi]===pi+1);if(ok)score+=t.pts;notes.push(ok?'✓ Paragraphs numbered in order.':'✗ Number every paragraph in order, top to bottom.')}
    if(t.unit==='word'){
      const circled=[...s.words].map(id=>{const [p,si,wi]=id.split('-').map(Number);return tok[p].sents[si].words[wi].n});
      const cs=new Set(circled), termWords=new Set(t.terms.flatMap(x=>x.split(' ')));
      const got=t.terms.filter(x=>x.split(' ').every(w=>cs.has(w))), miss=t.terms.filter(x=>!got.includes(x));
      const extra=[...new Set(circled.filter(w=>!termWords.has(w)))];
      const sc=Math.max(0,got.length-Math.floor(extra.length/2));score+=sc;
      notes.push(`${got.length===t.terms.length?'✓':'✗'} Key terms: ${got.length} of ${t.terms.length}.${miss.length?` Missed: ${miss.join(', ')}.`:''}${extra.length?` Not key terms: ${extra.join(', ')}.`:''}`);
    }
    if(t.unit==='sentence'){
      const mine=Object.keys(s.sents).filter(x=>s.sents[x]===t.id), right=mine.filter(x=>t.answer.includes(x)).length, wrong=mine.length-right;
      const sc=Math.round(t.pts*Math.max(0,right-wrong)/t.answer.length);score+=sc;
      notes.push(`${sc===t.pts?'✓':'✗'} ${t.label}: ${right} of ${t.answer.length} correct${wrong?`, ${wrong} marked by mistake`:''}.${sc<t.pts?' Dashed outlines show what you missed.':''}`);
    }
  });
  return {score,fb:`<div class="feedback">${notes.map(n=>`<div>${esc(n)}</div>`).join('')}</div>`};
}
function bindMark(el,st,draw){
  el.querySelectorAll('[data-mkt]').forEach(b=>b.onclick=()=>{st[b.dataset.k].tool=b.dataset.mkt;draw()});
  el.querySelectorAll('.mk-text:not(.done)').forEach(area=>area.onclick=e=>{
    const k=area.dataset.mkarea,s=st[k],unit=area.dataset.unit;
    if(unit==='word'){const w=e.target.closest('.mk-w');if(!w)return;s.words.has(w.dataset.w)?s.words.delete(w.dataset.w):s.words.add(w.dataset.w)}
    else if(unit==='sentence'){const x=e.target.closest('.mk-s');if(!x)return;const key=x.dataset.s;if(s.sents[key]===s.tool)delete s.sents[key];else s.sents[key]=s.tool}
    else if(unit==='para'){const p=e.target.closest('.mk-p');if(!p)return;const pi=p.dataset.p;if(s.nums[pi]){const n=s.nums[pi];delete s.nums[pi];Object.keys(s.nums).forEach(q=>{if(s.nums[q]>n)s.nums[q]--})}else s.nums[pi]=Object.keys(s.nums).length+1}
    const y=el.closest('.modal')?.scrollTop;draw();if(y!=null)el.closest('.modal').scrollTop=y;
  });
}

    return `<div class="submit"><h3>Send my score to my teacher</h3><div class="sgrid"><div><span class="lab">Your name</span><input class="txt" id="sbn" value="${esc(sv.name)}" placeholder="First and last name"></div><div><span class="lab">Period</span><select id="sbp"><option value="">Period</option>${[1,2,3,4,5,6,7,8].map(p=>`<option ${sv.period==p?'selected':''}>${p}</option>`).join('')}</select></div><div><span class="lab">Teacher</span>${tsel}</div></div>
    <div class="btnrow">${SUBMIT.formUrl?`<a class="btn" id="sblink" target="_blank" rel="noopener" aria-disabled="true">Open the form to submit</a>`:`<button class="btn" id="sbcopy">Copy my results</button>`}<span id="sbmsg" style="color:var(--muted)"></span></div>
    <p style="color:var(--muted);font-size:.88rem;margin:8px 0 0">${SUBMIT.formUrl?'Your answers are filled in for you. Press Submit on the Google Form that opens.':'Paste your results where your teacher tells you to (for example, a Google Classroom assignment).'}</p></div>`;
  }
  function wireSubmit(){
    const get=()=>{sv.name=el.querySelector('#sbn').value.trim();sv.period=el.querySelector('#sbp').value;sv.teacher=el.querySelector('#sbt').value.trim()};
    const payload=()=>({name:sv.name+(CUR&&CUR.id?` (ID ${CUR.id})`:''),period:sv.period,teacher:sv.teacher,activity:`${ch.strat} · ${ch.title}`,score:`${checked.score}/${total} (${Math.round(checked.score/total*100)}%)`,responses:checked.lines.join(' | ').slice(0,1500)});
    const upd=()=>{get();const ok=sv.name&&sv.teacher&&sv.period!=='';const a=el.querySelector('#sblink');
      if(a){if(ok){const d=payload(),q=Object.entries(SUBMIT.fields).filter(([k,v])=>v).map(([k,v])=>`entry.${String(v).replace(/^entry\./,'')}=${encodeURIComponent(d[k])}`).join('&');a.href=`${SUBMIT.formUrl}${SUBMIT.formUrl.includes('?')?'&':'?'}usp=pp_url&${q}`;a.removeAttribute('aria-disabled')}else{a.removeAttribute('href');a.setAttribute('aria-disabled','true')}}
      el.querySelector('#sbmsg').textContent=ok?'':'Add your name, period, and teacher.'};
    ['#sbn','#sbp','#sbt'].forEach(s=>{const x=el.querySelector(s);x.oninput=upd;x.onchange=upd});upd();
    const cp=el.querySelector('#sbcopy');
    if(cp)cp.onclick=async()=>{upd();if(!(sv.name&&sv.teacher&&sv.period!==''))return;const d=payload();const row=[new Date().toLocaleString(),d.name,d.period,d.teacher,d.activity,d.score,d.responses].join('\t');try{await navigator.clipboard.writeText(row);el.querySelector('#sbmsg').textContent='Copied! Paste it where your teacher asked.'}catch(e){el.querySelector('#sbmsg').textContent='Copy is blocked here. Take a screenshot of your score instead.'}};
  }
  draw();
}

const QW_PROMPTS=['What’s one thing you learned this week that surprised you?','Explain something from class to a 5th grader.','What’s a goal you have this week, and what’s your first step?','Describe a time you didn’t give up.','What question do you still have from class?','Agree or disagree: homework should be optional. Why?','What’s one thing you would change about your school, and how?','Write about someone who helped you learn something.','What does a great group member do?','If you could master one skill this year, what would it be and why?'];
function wicorExplorer(el,start){
  let cur=start||'W', tmr=null;
  const stopT=()=>{clearInterval(tmr);tmr=null};
  const draw=()=>{
    stopT();
    const d=WX[cur];
    el.innerHTML=`<div class="lesson"><div class="wx-letters" role="tablist">${Object.entries(WX).map(([k,x])=>`<button role="tab" aria-selected="${k===cur}" class="wx-l ${k===cur?'on':''}" style="--w:${x.color}" data-l="${k}"><b>${k}</b><span>${x.word}</span></button>`).join('')}</div>
     <div class="wx-panel" style="--w:${d.color}">
      <div class="wx-info"><div class="wx-big">${cur}</div><div><h3>${d.word}</h3><p>${d.def}</p><div class="wx-looks">${d.looks.map(x=>`<span>${x}</span>`).join('')}</div></div></div>
      <div class="wx-game"><div class="wx-gtitle">Quick play · ${d.game}</div><div id="wxg"></div></div>
      <div class="wx-ch"><div class="wx-gtitle">Graded challenges</div><div class="wx-chips">${d.ch.map(id=>`<button class="wx-chip" data-ch="${id}">${CH[id].title} →</button>`).join('')}</div></div>
     </div></div>`;
    el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=b.dataset.l;draw()});
    el.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>openItem('lesson',b.dataset.ch,getComputedStyle(modal).getPropertyValue('--c')));
    const g=el.querySelector('#wxg');
    if(cur==='W')quickwrite(g);else rapid(g,d,cur);
  };
  function quickwrite(g){
    let pi=Math.floor(Math.random()*QW_PROMPTS.length),secs=120,left=120;
    g.innerHTML=`<div class="qw-prompt" id="qwp">${QW_PROMPTS[pi]}</div><div class="btnrow" style="margin-top:8px">${[1,2,3].map(m=>`<button class="lvbtn ${m===2?'on':''}" data-qm="${m}">${m} min</button>`).join('')}<button class="btn ghost" id="qwn">New prompt</button></div>
     <textarea id="qwt" rows="6" placeholder="Start writing when the timer starts. Don’t stop, don’t erase!"></textarea>
     <div class="btnrow" style="justify-content:space-between"><button class="btn" id="qws">Start</button><span class="qw-stat"><b id="qwc">0:00</b> · <b id="qww">0</b> words</span></div>`;
    const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`, c=g.querySelector('#qwc'), t=g.querySelector('#qwt');
    c.textContent=fmt(left);
    g.querySelectorAll('[data-qm]').forEach(b=>b.onclick=()=>{stopT();secs=left=b.dataset.qm*60;c.textContent=fmt(left);g.querySelector('#qws').textContent='Start';g.querySelectorAll('[data-qm]').forEach(x=>x.classList.toggle('on',x===b))});
    g.querySelector('#qwn').onclick=()=>{pi=(pi+1)%QW_PROMPTS.length;g.querySelector('#qwp').textContent=QW_PROMPTS[pi]};
    t.oninput=()=>g.querySelector('#qww').textContent=words(t.value);
    g.querySelector('#qws').onclick=e=>{if(tmr){stopT();e.target.textContent='Resume';return}e.target.textContent='Pause';t.focus();tmr=setInterval(()=>{left--;c.textContent=fmt(Math.max(left,0));if(left<=0){stopT();e.target.textContent='Done!';e.target.disabled=true;t.readOnly=true;c.textContent=`Time! You wrote ${words(t.value)} words`}},1000)};
  }
  function rapid(g,d,key){
    const order=[...d.pool.keys()].sort(()=>Math.random()-.5).slice(0,8);
    let i=0,right=0,streak=0,best=0;
    const step=()=>{
      if(i>=order.length){g.innerHTML=`<div class="rf-done"><div class="rf-score">${right} / ${order.length}</div><div>Best streak: ${best} 🔥</div><div class="btnrow" style="justify-content:center"><button class="btn" id="rfa">Play again</button></div></div>`.replace(' 🔥','');g.querySelector('#rfa').onclick=()=>rapid(g,d,key);return}
      const it=d.pool[order[i]];
      let opts,ans;
      if(key==='C'){const others=d.stems.map((_,k)=>k).filter(k=>k!==it[1]).sort(()=>Math.random()-.5).slice(0,3);opts=[it[1],...others].sort(()=>Math.random()-.5).map(k=>d.stems[k]);ans=d.stems[it[1]]}else{opts=d.labels;ans=it[1]}
      g.innerHTML=`<div class="rf-top"><span>${i+1} of ${order.length}</span><span>Streak <b>${streak}</b></span></div><div class="rf-prompt">${esc(it[0])}</div><div class="rf-opts ${key==='C'?'stems':''}">${opts.map(o=>`<button class="rf-o" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="rff"></div>`;
      g.querySelectorAll('.rf-o').forEach(b=>b.onclick=()=>{
        const ok=b.dataset.o===ans; g.querySelectorAll('.rf-o').forEach(x=>{x.disabled=true;if(x.dataset.o===ans)x.classList.add('right')}); if(!ok)b.classList.add('wrong');
        if(ok){right++;streak++;best=Math.max(best,streak)}else streak=0;
        g.querySelector('#rff').innerHTML=`<div class="btnrow"><span style="font-weight:800;color:${ok?'var(--ok)':'var(--bad)'}">${ok?'Nice!':'Answer: '+esc(ans)}</span><button class="btn" id="rfn">${i===order.length-1?'See score':'Next'}</button></div>`;
        g.querySelector('#rfn').onclick=()=>{i++;step()};g.querySelector('#rfn').focus();
      });
    };step();
  }
  draw();
  return stopT;
}

function studentGate(el,title,info,onStart){

function wicorSub(s,key){
  const let_=WLET.find(x=>x[0]===key), sub=WSUB.find(x=>x[0]===key);
  if(!let_&&!sub){wicorHome(s);return}
  let title,color,blurb,body='',art;
  if(let_){const [L,n,c]=let_;title=`${L} · ${n}`;color=c;art=`<span class="biglet" style="color:${c}">${L}</span>`;
    const t=wTopic(s,L)||{items:[],sub:''};blurb=t.sub||'';
    body+=WSUB.map(([k,sn,e,sc,v])=>group(`${e} ${sn}`,t.items.filter(it=>wSubjOf(it)===v))).join('');

    body+=group('⚡ Warm-Up Game',warm);
    body+=group(`🧪 Practice ${n} inside a full lesson`,wFull(s).map(it=>({...it,feature:false,url:it.url+'#'+L,meta:`Jump to the ${L} station`})));

    body+=group('🧪 Full WICOR Lessons',wFull(s).filter(it=>it.subj===v));
    body+=WLET.map(([L,ln])=>group(`${L} · ${ln}`,(wTopic(s,L)||{items:[]}).items.filter(it=>wSubjOf(it)===v))).join('');

}

const kindOf=it=>it.k==='lesson'&&CH[it.id]?'graded':it.k;
function itemHTML(it,from){

  const cls=`rcard${it.add?' add':''}${it.feature?' feature':''}`;

  const links=[...app.querySelectorAll('[data-jump]')];
  links.forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.jump).scrollIntoView({behavior:'smooth'})});
  let fk='all',fs='all',fa='all';
  const applyF=()=>{app.querySelectorAll('.topic').forEach(sec=>{let n=0;sec.querySelectorAll('.rcard').forEach(c=>{const show=(fk==='all'||c.dataset.kind===fk)&&(fs==='all'||c.dataset.subj===fs)&&(fa==='all'||!c.dataset.aud||c.dataset.aud===fa||c.dataset.aud==='both');c.hidden=!show;if(show)n++});sec.hidden=n===0;const l=links.find(a=>a.dataset.jump===sec.id);if(l)l.hidden=n===0})};

    if(NO_SIGNIN.has(id)) cleanup=d.run(lz)||null;
    else studentGate(lz,d.title,ACT_INFO[id],st=>{lz.innerHTML=targetStrip(ACT_INFO[id],st)+'<div id="lz2"></div>';cleanup=d.run(lz.querySelector('#lz2'))||null;});}
  modal.querySelector('#cl').onclick=closeModal;
  const fs=modal.querySelector('#fs'); if(fs) fs.onclick=()=>{const on=modal.classList.toggle('full');fs.textContent=on?'Exit present':'Present';try{on?document.documentElement.requestFullscreen?.()?.catch(()=>{}):document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
  modal.querySelector('#cl').focus();
}
function closeModal(){if(cleanup){cleanup();cleanup=null}modal.hidden=true;modal.innerHTML='';document.body.style.overflow='';try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal()});
app.addEventListener('click',e=>{const b=e.target.closest('button.rcard');if(!b)return;const c=getComputedStyle(b).getPropertyValue('--c');openItem(b.dataset.k,b.dataset.id,c)});
function route(){closeModal();const id=location.hash.slice(1);const [main,sub]=id.split('/');const s=SECTIONS.find(x=>x.id===main);qInput.value='';if(s&&s.id==='wicor'&&sub)wicorSub(s,sub);else s?section(s):home();window.scrollTo(0,0)}
qInput.addEventListener('input',()=>{if(qInput.value.trim()){home(qInput.value.trim())}else route()});
window.addEventListener('hashchange',route);route();
</script>
